# API 网关配置 (Docker 环境)
# 服务地址使用容器名称而非 localhost
server:
  name: "ai-qa-gateway"
  port: 8080
  mode: "${GIN_MODE:-debug}"  # debug | release | test
  read_timeout: 30s
  write_timeout: 60s
  max_header_bytes: 1MB

log:
  level: "${LOG_LEVEL:-info}"
  format: "json"  # json | console
  output: "stdout"

database:
  dsn: "postgres://aiqa:aiqa_secure_pass_2026@postgres:5432/aiqa?sslmode=disable"
  max_open_conns: 50
  max_idle_conns: 20
  conn_max_lifetime: 30m

redis:
  addr: "redis:6379"
  password: "aiqa_redis_pass_2026"
  db: 0
  pool_size: 50

jwt:
  secret: "${JWT_SECRET:-change-this-to-a-secure-jwt-secret}"
  expiry_hours: 24

rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

# 后端服务路由 (多副本场景使用负载均衡 DNS)
services:
  rag_service:
    base_url: "http://rag-service:8001"
    timeout: 120s
    retry_count: 2
  llm_service:
    base_url: "http://vllm:8000/v1"
    timeout: 120s

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://frontend:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Request-ID"
