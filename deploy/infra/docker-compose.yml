# 企业级 AI 智能问答系统 - 基础设施 Docker Compose
# 版本: v1.0.0

networks:
  ai-qa-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  milvus-data:
  milvus-etcd-data:
  milvus-minio-data:
  postgres-data:
  redis-data:
  minio-data:

services:
  # ============================================================
  # 1. 向量数据库 - Milvus (企业级，支持百亿级向量检索)
  # ============================================================
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: aiqa-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - ai-qa-net
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: aiqa-milvus-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio-data:/minio_data
    networks:
      - ai-qa-net
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: aiqa-milvus
    restart: always
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # 性能优化参数
      KNOWHERE_GPU_RESOURCE_ENABLE: "true"
      QUERY_NODE_ENABLE_DISK_INDEX: "true"
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # HTTP
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - ai-qa-net
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # 2. 元数据数据库 - PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: aiqa-postgres
    restart: always
    environment:
      POSTGRES_USER: aiqa
      POSTGRES_PASSWORD: aiqa_secure_pass_2026
      POSTGRES_DB: aiqa
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ai-qa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 3. 缓存 - Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: aiqa-redis
    restart: always
    command: redis-server --requirepass aiqa_redis_pass_2026 --maxmemory 4gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-qa-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 4. 对象存储 - MinIO (原始文档存储)
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: aiqa-minio
    restart: always
    environment:
      MINIO_ROOT_USER: aiqa_admin
      MINIO_ROOT_PASSWORD: aiqa_minio_pass_2026
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    networks:
      - ai-qa-net
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # 6. RAG 服务 (FastAPI)
  #    docker compose up -d --scale rag-service=2  # 启动 2 副本
  # ============================================================
  rag-service:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.rag
    image: aiqa-rag-service:latest
    restart: always
    ports:
      - "8001"
    environment:
      APP_PORT: "8001"
      REDIS_URL: "redis://:aiqa_redis_pass_2026@redis:6379/0"
      POSTGRES_DSN: "postgresql+asyncpg://aiqa:aiqa_secure_pass_2026@postgres:5432/aiqa"
      MILVUS_HOST: "milvus"
      MINIO_ENDPOINT: "minio:9000"
      LLM_BASE_URL: "http://vllm:8000/v1"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-info}"
      JWT_SECRET: "${JWT_SECRET:-change-this-to-a-secure-jwt-secret}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    networks:
      - ai-qa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # 7. RAG Worker (文档索引消费者)
  #    独立于 API 进程，通过 Redis Streams 消费任务
  #    scale 与 rag-service 一致或独立调整
  # ============================================================
  rag-worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.rag
    image: aiqa-rag-service:latest
    restart: always
    command: python -m workers.document_worker worker-1
    environment:
      REDIS_URL: "redis://:aiqa_redis_pass_2026@redis:6379/0"
      POSTGRES_DSN: "postgresql+asyncpg://aiqa:aiqa_secure_pass_2026@postgres:5432/aiqa"
      MILVUS_HOST: "milvus"
      MINIO_ENDPOINT: "minio:9000"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-info}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-qa-net
    deploy:
      replicas: 2  # 默认 2 个 Worker 副本

  # ============================================================
  # 8. API 网关 (Go)
  #    docker compose up -d --scale gateway=2
  # ============================================================
  gateway:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.gateway
    image: aiqa-gateway:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: "${GIN_MODE:-debug}"
      CONFIG_PATH: "/app/config.yaml"
    volumes:
      - ./gateway-config.yaml:/app/config.yaml:ro
    depends_on:
      rag-service:
        condition: service_started
    networks:
      - ai-qa-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1

