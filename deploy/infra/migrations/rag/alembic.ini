# RAG 服务数据库迁移配置
# 使用方式:
#   alembic -c deploy/infra/migrations/rag/alembic.ini upgrade head
#   alembic -c deploy/infra/migrations/rag/alembic.ini revision --autogenerate -m "描述"

[alembic]
script_location = deploy/infra/migrations/rag
sqlalchemy.url = postgresql+asyncpg://aiqa:aiqa_secure_pass_2026@localhost:5432/aiqa_rag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
