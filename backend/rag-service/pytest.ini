[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 覆盖率配置
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --tb=short
    -v

# 标记 -m "not slow" 可跳过 GPU/模型测试
markers =
    slow: 需要 GPU 或大模型加载的测试 (默认跳过)
    integration: 需要外部服务 (Redis/Milvus/PostgreSQL) 的测试
    unit: 纯单元测试 (默认)
