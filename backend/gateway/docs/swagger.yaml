basePath: /api/v1
definitions:
  internal_handler.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.RegisterRequest:
    properties:
      accepted_privacy_policy:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
host: localhost:8080
info:
  contact:
    name: AI QA System Team
    url: https://github.com/nieen/ai-qa-system
  description: |-
    企业级 AI 智能问答系统 - API 网关

    ## 服务架构
    - **API 网关** (本服务) → 认证/限流/路由/熔断
    - **RAG 服务** → 文档索引/向量检索/LLM 问答
    - **PostgreSQL** → 用户/对话/审计日志
    - **Redis** → 缓存/分布式限流/Token 黑名单
    - **Milvus** → 向量数据库

    ## 认证方式
    ```
    POST /api/v1/auth/login  →  获取 JWT Token
    Authorization: Bearer <token>  →  访问受保护端点
    ```

    ## 数据合规
    - 数据导出: GET /api/v1/user/export (PIPL §45)
    - 删除账户: POST /api/v1/user/delete-request (PIPL §47)
    - 审计日志: 所有写操作自动记录
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/nieen/ai-qa-system
  title: AI QA System API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 验证用户名密码，返回 JWT Token
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回 token 和用户信息
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 用户名或密码错误
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 账户已被禁用
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 认证服务暂不可用
          schema:
            additionalProperties: true
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 创建新用户，需要同意隐私政策
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误或未同意隐私政策
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 用户名已存在
          schema:
            additionalProperties: true
            type: object
      summary: 用户注册
      tags:
      - 认证
  /knowledge-bases:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 知识库列表
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取知识库列表
      tags:
      - 知识库
  /knowledge-bases/{kbId}/chat:
    post:
      consumes:
      - application/json
      description: 发送问题进行知识库问答，返回 SSE 流式响应
      parameters:
      - description: 知识库 ID
        in: path
        name: kbId
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 知识库问答
      tags:
      - 问答
  /user/delete-request:
    post:
      description: 创建删除账号请求（7天冷静期），符合 PIPL 第 47 条被遗忘权
      produces:
      - application/json
      responses:
        "200":
          description: 删除请求已创建
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 请求删除账号
      tags:
      - 数据合规
  /user/export:
    get:
      description: 导出当前用户的所有个人数据（资料、对话、文档），符合 PIPL 第 45 条数据可携带权
      produces:
      - application/json
      responses:
        "200":
          description: 用户数据
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 导出个人数据
      tags:
      - 数据合规
  /user/logout:
    post:
      description: 登出当前用户，将当前 Token 加入黑名单吊销
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 用户管理
  /user/profile:
    get:
      description: 获取已登录用户的详细个人信息
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - 用户管理
securityDefinitions:
  BearerAuth:
    description: 'JWT Token (格式: Bearer \<token\>)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
