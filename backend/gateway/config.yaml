# API 网关配置
server:
  name: "ai-qa-gateway"
  port: 8080
  mode: "debug"  # debug | release | test
  read_timeout: 30s
  write_timeout: 60s
  max_header_bytes: 1MB

log:
  level: "info"
  format: "json"  # json | console
  output: "stdout"

database:
  dsn: "postgres://aiqa:aiqa_secure_pass_2026@localhost:5432/aiqa_gateway?sslmode=disable"
  max_open_conns: 50
  max_idle_conns: 20
  conn_max_lifetime: 30m

redis:
  addr: "localhost:6379"
  password: "aiqa_redis_pass_2026"
  db: 0
  pool_size: 50

jwt:
  secret: "change-this-to-a-secure-jwt-secret"
  expiry_hours: 24

rate_limit:
  enabled: true
  type: "redis"      # "local" (单实例内存) | "redis" (多副本分布式)
  requests_per_second: 100
  burst: 200

# 后端服务路由
services:
  rag_service:
    base_url: "http://localhost:8001"
    timeout: 120s
    retry_count: 2
  llm_service:
    base_url: "http://localhost:8000/v1"
    timeout: 120s

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Request-ID"
