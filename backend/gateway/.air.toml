# ───────────────────────────────────────────────────
# Air — Go 网关热重载配置
# 监听 backend/gateway/ 下 .go 文件变更自动重编译
# ───────────────────────────────────────────────────
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/gateway ./cmd/main.go"
  bin = "tmp/gateway"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  delay = 1000  # ms
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500  # ms
  log = "build-errors.log"

[log]
  main_only = false
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
